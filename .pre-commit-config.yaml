# Pre-commit hooks. Install once:
#   pip install pre-commit && pre-commit install
# The fmt/clippy gates were previously enforced only in CI -- a broken `cargo fmt`
# already slipped through once (2026-08-15, health.rs trailing whitespace); these
# hooks catch the same class locally, before the commit.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cd "$PWD" && cargo fmt -- --check'
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: bash -c 'cd "$PWD" && cargo clippy --all-targets -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false
