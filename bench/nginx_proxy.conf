worker_processes auto;
events {
    worker_connections 4096;
}
http {
    access_log off;
    upstream backend {
        server 192.168.88.251:8080;
        keepalive 64;
    }
    server {
        listen 8081;
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
