name: Rust CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Check formatting
      run: cargo fmt --check

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Build
      run: cargo build --workspace

    - name: Unit + integration tests
      run: cargo test --workspace

    # Hot-path CPU-cycle profile (opt-in feature, src/cycles.rs). bench/perf_gate.sh
    # runs the #[ignore]d cycle_profile_report and FAILS on >1.5x regression vs the
    # authored baseline. SKIP_PERF_GATE=1 to bypass.
    - name: Cycle-profile gate
      run: ./bench/perf_gate.sh

    - name: Config-parse smoke (rproxy -t)
      run: |
        cargo build --release
        ./target/release/rproxy -t -c bench/rproxy.yaml

    - name: Cargo audit
      run: |
        cargo install cargo-audit --locked || cargo install cargo-audit
        cargo audit

  # Real-process E2E. Workers build monoio io-uring runtimes, which need a high
  # RLIMIT_MEMLOCK (stock GitHub runners allow it); the default `cargo test` run
  # skips these as #[ignore]. Opt in by setting the repository/environment
  # variable RUN_E2E to any non-empty value.
  e2e:
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_E2E != '' }}
    steps:
    - uses: actions/checkout@v7
    - name: Run e2e_scenarios + monoio unit tests
      run: |
        ulimit -l unlimited
        cargo test --release --features cycle_profile -- --ignored --nocapture e2e_scenarios
        # test_pipe_body tests are plain (not #[ignore]) monoio tests
        cargo test --release -- --nocapture test_pipe_body
